<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/slider.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <title>Bem vindo! ao NewTol</title>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <img src="img/chave.png" class="brand-image" alt="Logo">
                NewTol
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Loja</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="html/suporte.html">Suporte</a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="html/conta.html"><img src="img/login.png" height="15" alt="Login"> Login</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    
    <div id="carouselExampleIndicators" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
            <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1" aria-label="Slide 2"></button>
            <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2" aria-label="Slide 3"></button>
        </div>
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="img/gtaVI.jpg" class="d-block w-100" alt="GTA VI">
            </div>
            <div class="carousel-item">
                <img src="img/tf.jpg" class="d-block w-100" alt="TF">
            </div>
            <div class="carousel-item">
                <img src="img/fifa25.jpg" class="d-block w-100" alt="FIFA 25">
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
        </button>
    </div>
    
    <div class="container mt-4">
        <div class="conteudo">
            <h3>Publique seu Jogo</h3>
            <h5>Para publicar seu jogo,<p>fale nome e sua categoria.</p></h5>
            <form>
                <div class="mb-3">
                    <label for="nomeJogo" class="form-label">Qual nome do jogo:</label>
                    <input type="text" class="form-control" id="nomeJogo" placeholder="Digite o nome:" required>
                </div>
                <div class="mb-3">
                    <label for="categoriaJogo" class="form-label">Qual categoria?:</label>
                    <input type="text" class="form-control" id="categoriaJogo" placeholder="Digite a categoria:" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Qual seu email:</label>
                    <input type="email" class="form-control" id="email" placeholder="Digite seu melhor email:" required>
                </div>
                <button type="submit" class="btn btn-primary">Publique seu jogo!! :)</button>
            </form>
        </div>
    </div>
    
    <script src="js/java.js"></script>
</body>
</html>
